# Wanhao Duplicator 4 - PLA 1.75 mm - profile for the PrusaSlicer engine used by Duplicator 4 Studio.
# Start/end G-code are EMPTY on purpose: gcode2x3g.py adds the proven start sequence
# (slow Z homing with heaters off, heat, prime line) and end sequence for this printer.
# The bed is NOT heated (faulty bed thermistor) -> brim + slow first layer for adhesion.

# ---- printer ---------------------------------------------------------------------------
bed_shape = 0x0,225x0,225x145,0x145
max_print_height = 140
nozzle_diameter = 0.4
gcode_flavor = reprap
use_relative_e_distances = 1
arc_fitting = disabled
binary_gcode = 0
gcode_resolution = 0.05
resolution = 0.01
thumbnails =
start_gcode =
end_gcode =
before_layer_gcode =
layer_gcode =
toolchange_gcode =
autoemit_temperature_commands = 0
z_offset = 0
extruder_offset = 0x0
complete_objects = 0
wipe_tower = 0
travel_speed = 100
travel_speed_z = 10
machine_limits_usage = time_estimate_only

# ---- filament: PLA ---------------------------------------------------------------------
filament_diameter = 1.75
temperature = 210
first_layer_temperature = 220
bed_temperature = 0
first_layer_bed_temperature = 0
extrusion_multiplier = 1
# no part-cooling fan on this printer: slow down small layers so they can cool
cooling = 1
fan_always_on = 0
slowdown_below_layer_time = 15
min_print_speed = 8

# ---- retraction (direct-drive Mk8) -----------------------------------------------------
retract_length = 1
retract_speed = 25
retract_before_travel = 1.5
retract_lift = 0.2
retract_layer_change = 1
wipe = 1

# ---- layers & shells -------------------------------------------------------------------
layer_height = 0.2
first_layer_height = 0.3
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
ensure_vertical_shell_thickness = enabled
perimeter_generator = arachne
seam_position = aligned
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
elefant_foot_compensation = 0.1
variable_layer_height = 0

# ---- infill ----------------------------------------------------------------------------
fill_density = 20%
# straight-line infill: fewer tiny segments -> smooth USB streaming, strong parts
fill_pattern = cubic
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic

# ---- adhesion --------------------------------------------------------------------------
skirts = 0
brim_type = outer_only
brim_width = 5

# ---- supports (off by default; the app switches them on) -------------------------------
support_material = 0
support_material_auto = 1
support_material_contact_distance = 0.2
dont_support_bridges = 1

# ---- speeds (mm/s) - moderate for a Replicator-1 class machine ---------------------------
first_layer_speed = 15
perimeter_speed = 35
external_perimeter_speed = 25
small_perimeter_speed = 15
infill_speed = 45
solid_infill_speed = 30
top_solid_infill_speed = 20
bridge_speed = 25
gap_fill_speed = 20
support_material_speed = 40

output_filename_format = [input_filename_base].gcode

# keep top/bottom thickness when the layer height changes (fine 0.1 mm or draft 0.3 mm)
top_solid_min_thickness = 0.8
bottom_solid_min_thickness = 0.6
